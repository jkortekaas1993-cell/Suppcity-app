name: Build app (EAS)

# Manual: Actions → "Build app (EAS)" → Run workflow. Builds an installable Android test APK
# on Expo's servers; the download link appears in the run summary and on expo.dev.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: if [ -z "$EXPO_TOKEN" ]; then echo "::error::GitHub secret EXPO_TOKEN is not set"; exit 1; fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --no-audit --no-fund
      - name: Start build
        run: |
          if ! eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" \
            --non-interactive --no-wait --json > build.json 2> eas.log; then
            tail -30 eas.log | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          node -e "
            const b = require('./build.json');
            for (const x of [].concat(b)) {
              const url = 'https://expo.dev/accounts/' + x.project.ownerAccount.name + '/projects/' + x.project.slug + '/builds/' + x.id;
              console.log('::notice::Build started (' + x.platform + '): ' + url);
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '- ' + x.platform + ': ' + url + '\n');
            }"
