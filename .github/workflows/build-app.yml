name: Build app (EAS)

# Manual: Actions → "Build app (EAS)" → Run workflow. Builds an installable Android test APK
# on Expo's servers; the download link appears in the run summary and on expo.dev.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: if [ -z "$EXPO_TOKEN" ]; then echo "::error::GitHub secret EXPO_TOKEN is not set"; exit 1; fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --no-audit --no-fund
      - name: Start build
        run: |
          if ! eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" \
            --non-interactive --no-wait --json > build.json 2> eas.log < /dev/null; then
            cat eas.log build.json 2>/dev/null | grep -v '^\s*$' | tail -40 | while IFS= read -r l; do echo "::error::$l"; done
            # Logs are not downloadable outside GitHub: publish them to the ci/logs branch.
            mkdir -p /tmp/l && cp eas.log build.json /tmp/l/ 2>/dev/null || true
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout --orphan ci/logs && git rm -rfq . && cp /tmp/l/* . 2>/dev/null; git add -A
            git commit -qm "EAS build log" && git push -fq origin ci/logs || true
            exit 1
          fi
          node -e "
            const b = [].concat(require('./build.json'));
            for (const x of b) {
              const url = 'https://expo.dev/accounts/suppcity-app/projects/suppcity-app/builds/' + x.id;
              console.log('::notice::Build started (' + x.platform + '): ' + url);
              require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, '- ' + x.platform + ': ' + url + '\\n');
            }"
