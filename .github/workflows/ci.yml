name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # npm cache needs package-lock.json; re-add `cache: npm` once it is committed.
      # Hard rule 7: exact versions only (no ^ or ~ ranges).
      - name: Check pinned versions
        run: |
          node -e "const p=require('./package.json');const bad=Object.entries({...p.dependencies,...p.devDependencies}).filter(([,v])=>!/^\d+\.\d+\.\d+$/.test(v));if(bad.length){console.error('Unpinned:',bad);process.exit(1)}"
      # `npm ci` as soon as package-lock.json is committed; `npm install` only until then
      # (the lockfile is generated in CI: download the package-lock artifact and commit it).
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci
          else npm install --no-audit --no-fund && echo "GENERATED_LOCK=1" >> "$GITHUB_ENV"; fi
      - name: Upload generated lockfile (until it is committed)
        if: env.GENERATED_LOCK == '1'
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: ignore
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
