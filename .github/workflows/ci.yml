name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Hard rule 7: exact versions only (no ^ or ~ ranges).
      - name: Check pinned versions
        run: |
          node -e "const p=require('./package.json');const bad=Object.entries({...p.dependencies,...p.devDependencies}).filter(([,v])=>!/^\d+\.\d+\.\d+$/.test(v));if(bad.length){console.error('Unpinned:',bad);process.exit(1)}"
      # `npm ci` as soon as package-lock.json is committed; `npm install` only until then
      # (the lockfile is generated in CI: download the package-lock artifact and commit it).
      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            if ! npm ci --no-audit --no-fund > npm-install.log 2>&1; then
              grep -E "npm (error|ERR)" npm-install.log | tail -25 | while IFS= read -r l; do echo "::error::$l"; done
              exit 1
            fi
          else
            if ! npm install --no-audit --no-fund > npm-install.log 2>&1; then
              # Surface the npm error as annotations (readable via the checks API).
              grep -E "npm (error|ERR)" npm-install.log | tail -25 | while IFS= read -r l; do echo "::error::$l"; done
              exit 1
            fi
            echo "GENERATED_LOCK=1" >> "$GITHUB_ENV"
          fi
      - name: Upload generated lockfile (until it is committed)
        if: env.GENERATED_LOCK == '1'
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          if-no-files-found: ignore
      - name: Push generated lockfile to ci/lockfile branch (until it is committed)
        if: env.GENERATED_LOCK == '1' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b ci/lockfile
          git add -f package-lock.json
          git commit -m "chore: generated package-lock.json from CI"
          git push -f origin ci/lockfile
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: |
          if ! npm run lint -- -f json -o eslint.json; then
            node -e "for (const f of require('./eslint.json')) for (const m of f.messages) console.log('::error file=' + f.filePath.replace(process.cwd() + '/', '') + ',line=' + (m.line || 1) + '::' + (m.ruleId || 'eslint') + ': ' + m.message)"
            exit 1
          fi
      - name: Test
        run: |
          if ! npm test -- --json --outputFile=jest.json > jest.log 2>&1; then
            node -e "
              const fs = require('fs');
              let r; try { r = JSON.parse(fs.readFileSync('jest.json', 'utf8')); } catch { r = null; }
              const clean = (t) => String(t).replace(/\\u001b\\[[0-9;]*m/g, '').split('\\n').filter(Boolean).slice(0, 6).join(' | ').slice(0, 900);
              if (!r) { console.log('::error::' + clean(fs.readFileSync('jest.log', 'utf8').slice(-3000))); process.exit(0); }
              for (const f of r.testResults) {
                const file = f.name.replace(process.cwd() + '/', '');
                if (f.status === 'failed' && f.assertionResults.every(a => a.status !== 'failed')) console.log('::error file=' + file + '::' + clean(f.message));
                for (const a of f.assertionResults) if (a.status === 'failed') console.log('::error file=' + file + '::' + a.fullName + ' -> ' + clean(a.failureMessages.join(' ')));
              }
              console.log('::error::totals ' + r.numPassedTests + ' passed, ' + r.numFailedTests + ' failed, suites failed ' + r.numFailedTestSuites);
            "
            exit 1
          fi
