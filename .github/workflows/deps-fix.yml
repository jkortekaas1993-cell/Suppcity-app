name: Align dependencies with Expo SDK

# Manual: runs `npx expo install --fix` (exact versions via .npmrc save-exact),
# regenerates package-lock.json and pushes the result to the ci/deps branch for review.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: Space-separated packages to add with `npx expo install` (optional)
        required: false
        default: ''

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Add packages
        if: inputs.packages != ''
        run: |
          npx expo install ${{ inputs.packages }} > add.log 2>&1 || echo "::warning::expo install exited non-zero; see add.log on ci/deps"
          echo "exit=$?" >> add.log
      - name: expo install --fix
        run: |
          npx expo install --fix > fix.log 2>&1 || echo "::warning::expo install --fix exited non-zero; see fix.log on ci/deps"
          npx expo install --check > check.log 2>&1 || true
          npx -y expo-doctor > doctor.log 2>&1 || true
          npm ls @react-navigation/native > nav.log 2>&1 || true
      - name: Push to ci/deps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b ci/deps
          touch add.log; git add -f package.json package-lock.json add.log fix.log check.log doctor.log nav.log
          git commit -m "chore: align dependencies with Expo SDK (expo install --fix)"
          git push -f origin ci/deps
