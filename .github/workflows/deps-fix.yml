name: Align dependencies with Expo SDK

# Manual: runs `npx expo install --fix` (exact versions via .npmrc save-exact),
# regenerates package-lock.json and pushes the result to the ci/deps branch for review.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: expo install --fix
        run: |
          npx expo install --fix > fix.log 2>&1 || (tail -30 fix.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1)
          npx expo install --check > check.log 2>&1 || true
          npx -y expo-doctor > doctor.log 2>&1 || true
          npm ls @react-navigation/native > nav.log 2>&1 || true
      - name: Push to ci/deps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b ci/deps
          git add -f package.json package-lock.json fix.log check.log doctor.log nav.log
          git commit -m "chore: align dependencies with Expo SDK (expo install --fix)"
          git push -f origin ci/deps
