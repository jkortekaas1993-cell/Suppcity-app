<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Voortgang</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#08090A}
a{color:#4FE0D0}a:hover{color:#1FC7B6}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #08090A; color: #F2F4F3; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex: 1; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; line-height: 42px; font-weight: 800; text-transform: uppercase">Voortgang</div>

    <div style="display: flex; gap: 6px; background: #111416; border: 1px solid #2C3338; border-radius: 10px; padding: 4px">
      <button style="flex: 1; height: 34px; border: none; border-radius: 7px; background: #252B2F; color: #F2F4F3; font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 14px">Oefening</button>
      <button style="flex: 1; height: 34px; border: none; border-radius: 7px; background: none; color: #7E8990; font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 14px">Week</button>
      <button style="flex: 1; height: 34px; border: none; border-radius: 7px; background: none; color: #7E8990; font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 14px">Lichaam</button>
    </div>

    <div style="background: #111416; border: 1px solid #2C3338; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <button style="display: flex; align-items: center; gap: 6px; background: none; border: none; padding: 0; color: #F2F4F3; font-family: 'Barlow', sans-serif; font-size: 17px; font-weight: 700">Bench press
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A7B0B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <span style="font-size: 13px; color: #7E8990">6 maanden</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 48px; line-height: 48px; font-weight: 800; font-variant-numeric: tabular-nums">108</span>
        <span style="font-size: 14px; color: #A7B0B5">kg geschat 1RM</span>
        <span style="font-size: 13px; font-weight: 600; color: #3DD68C">+14 kg</span>
      </div>
      <svg width="324" height="150" viewBox="0 0 324 150" role="img" aria-label="Geschat 1RM bench press stijgt van 94 naar 108 kilo in zes maanden">
        <defs>
          <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1FC7B6" stop-opacity="0.28"/><stop offset="1" stop-color="#1FC7B6" stop-opacity="0"/></linearGradient>
        </defs>
        <line x1="0" y1="20" x2="324" y2="20" stroke="#2C3338" stroke-width="1"/>
        <line x1="0" y1="65" x2="324" y2="65" stroke="#2C3338" stroke-width="1"/>
        <line x1="0" y1="110" x2="324" y2="110" stroke="#2C3338" stroke-width="1"/>
        <text x="324" y="16" text-anchor="end" font-size="10" fill="#7E8990" font-family="Barlow">110</text>
        <text x="324" y="61" text-anchor="end" font-size="10" fill="#7E8990" font-family="Barlow">100</text>
        <text x="324" y="106" text-anchor="end" font-size="10" fill="#7E8990" font-family="Barlow">90</text>
        <path d="M4 92 L40 88 L76 90 L112 80 L148 74 L184 70 L220 62 L256 50 L292 40 L300 29 L300 128 L4 128 Z" fill="url(#fill)"/>
        <path d="M4 92 L40 88 L76 90 L112 80 L148 74 L184 70 L220 62 L256 50 L292 40 L300 29" fill="none" stroke="#1FC7B6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="148" cy="74" r="4" fill="#F5B544"/>
        <circle cx="300" cy="29" r="5" fill="#F5B544" stroke="#08090A" stroke-width="2"/>
        <text x="4" y="146" font-size="10" fill="#7E8990" font-family="Barlow">mei</text>
        <text x="112" y="146" font-size="10" fill="#7E8990" font-family="Barlow">jul</text>
        <text x="220" y="146" font-size="10" fill="#7E8990" font-family="Barlow">sep</text>
        <text x="282" y="146" font-size="10" fill="#7E8990" font-family="Barlow">okt</text>
      </svg>
      <div style="display: flex; gap: 14px; font-size: 12px; color: #A7B0B5">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 3px; border-radius: 2px; background: #1FC7B6"></span>Geschat 1RM</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #F5B544"></span>PR</span>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="background: #111416; border: 1px solid #2C3338; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: #A7B0B5; text-transform: uppercase">Zwaarste set</div>
        <div style="display: flex; align-items: baseline; gap: 4px"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums">100</span><span style="font-size: 13px; color: #7E8990">kg × 3</span></div>
      </div>
      <div style="background: #111416; border: 1px solid #2C3338; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: #A7B0B5; text-transform: uppercase">Beste volume</div>
        <div style="display: flex; align-items: baseline; gap: 4px"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums">2.775</span><span style="font-size: 13px; color: #7E8990">kg</span></div>
      </div>
    </div>

    <div style="background: #111416; border: 1px solid #2C3338; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between"><span style="font-size: 11px; font-weight: 700; letter-spacing: 1.6px; color: #A7B0B5; text-transform: uppercase">Sets per spiergroep · deze week</span></div>
      <div style="display: grid; grid-template-columns: 70px 1fr 28px; gap: 8px 10px; align-items: center; font-size: 13px; font-variant-numeric: tabular-nums">
        <span style="color: #A7B0B5">Borst</span><div style="height: 8px; border-radius: 4px; background: #252B2F"><div style="width: 90%; height: 8px; border-radius: 4px; background: #1FC7B6"></div></div><span style="text-align: right; font-weight: 600">14</span>
        <span style="color: #A7B0B5">Rug</span><div style="height: 8px; border-radius: 4px; background: #252B2F"><div style="width: 70%; height: 8px; border-radius: 4px; background: #1FC7B6"></div></div><span style="text-align: right; font-weight: 600">11</span>
        <span style="color: #A7B0B5">Schouders</span><div style="height: 8px; border-radius: 4px; background: #252B2F"><div style="width: 58%; height: 8px; border-radius: 4px; background: #1FC7B6"></div></div><span style="text-align: right; font-weight: 600">9</span>
        <span style="color: #A7B0B5">Benen</span><div style="height: 8px; border-radius: 4px; background: #252B2F"><div style="width: 25%; height: 8px; border-radius: 4px; background: #1FC7B6"></div></div><span style="text-align: right; font-weight: 600">4</span>
      </div>
    </div>
  </div>

  <nav aria-label="Hoofdmenu" style="height: 84px; border-top: 1px solid #2C3338; background: rgba(8,9,10,0.94); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px 4px 24px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #7E8990; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7E8990" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>Vandaag</a>
    <a href="Workout.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #1FC7B6; font-size: 11px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1FC7B6" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>Trainen</a>
    <a href="Voeding.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #7E8990; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7E8990" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 4"/></svg>Voeding</a>
    <a href="Shop.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #7E8990; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7E8990" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0"/></svg>Shop</a>
    <a href="Mijlpalen.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #7E8990; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#7E8990" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Ik</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }

</body>
</html>
